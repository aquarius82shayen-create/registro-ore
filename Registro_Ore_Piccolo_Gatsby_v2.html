<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Registro Ore">
<meta name="theme-color" content="#c4b3a0">
<title>Registro Ore</title>
<style>
:root{
 --bg:#d8ccb9;--bg2:#eee7dc;--panel:#f7f3ec;--panel2:#e7ddd0;--ink:#242321;--muted:#716b63;
 --line:#c9bba9;--dark:#292825;--cream:#f4eadb;--gold:#c9a85a;--gold-soft:#e0c681;--good:#2f7652;--bad:#9b3c35;
 --off:#dce9dc;--ferie:#dcebf4;--shadow:0 8px 24px rgba(42,35,28,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#302f2c 0 29%,var(--bg) 29% 100%);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:24px}
.header{position:relative;padding:16px 18px 24px;color:var(--cream);overflow:hidden;background:radial-gradient(circle at 50% 12%,rgba(255,255,255,.06),transparent 30%),linear-gradient(180deg,#302f2c,#242320);min-height:255px}
.header:after{content:"";position:absolute;inset:auto 10% 0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.8}
.header-top{height:40px;display:flex;justify-content:flex-end;align-items:center;position:relative;z-index:5}
.settings-gear{width:40px;height:40px;border:1px solid rgba(224,198,129,.55);background:rgba(255,255,255,.035);color:var(--gold-soft);border-radius:12px;font-size:22px;line-height:1;display:grid;place-items:center;transition:.2s ease}
.settings-gear:active{transform:scale(.94)}
.logo-wrap{display:flex;justify-content:center;margin:-8px 0 7px;position:relative;z-index:2}
.logo{width:116px;height:116px;object-fit:contain;border-radius:50%;display:block;box-shadow:0 0 0 1px rgba(224,198,129,.18)}
.brand-sub{position:absolute;left:21px;bottom:73px;font-family:Georgia,serif;font-size:10px;letter-spacing:4px;line-height:1.9;color:var(--gold-soft);text-align:left}
.brand-sub:after{content:"";display:block;width:44px;height:1px;background:var(--gold);margin-top:3px;opacity:.75}
.header-art{position:absolute;right:18px;bottom:57px;width:112px;height:76px;opacity:.9;color:var(--gold-soft)}
.header-art svg{width:100%;height:100%;display:block}
.title{margin:0;text-align:center;font:700 clamp(40px,9vw,58px)/.95 Georgia,"Times New Roman",serif;letter-spacing:-1.2px;color:var(--cream);position:relative;z-index:2}
.title-rule{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:9px;color:var(--gold);position:relative;z-index:2}.title-rule span{width:54px;height:1px;background:var(--gold);opacity:.75}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 14px 10px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 10px;box-shadow:var(--shadow)}
.month-btn{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--ink);font-size:24px}.month-label{display:flex;align-items:center;gap:9px;font:600 21px Georgia,serif}.month-label small{font:normal 16px system-ui;color:var(--muted)}
.table-shell{margin:0 14px;background:rgba(247,243,236,.92);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.table-head,.row{display:grid;grid-template-columns:1.04fr .98fr 1.08fr 1.08fr .98fr;gap:6px;align-items:center}
.table-head{padding:12px 10px 9px;background:var(--panel2);font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.35px}
.rows{max-height:640px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.row{min-height:66px;padding:6px 10px;border-top:1px solid rgba(201,187,169,.65);background:rgba(255,255,255,.38);position:relative}
.row:nth-child(even){background:rgba(255,255,255,.58)}.row.off{background:var(--off)}.row.ferie{background:var(--ferie)}
.row.current-day{border:1.5px solid var(--gold);margin:2px 4px;border-radius:12px;min-height:62px;animation:breathGold 2.2s ease-in-out infinite;box-shadow:0 0 0 0 rgba(201,168,90,.12)}
@keyframes breathGold{0%,100%{box-shadow:0 0 0 0 rgba(201,168,90,.10),0 0 7px rgba(201,168,90,.14)}50%{box-shadow:0 0 0 4px rgba(201,168,90,.12),0 0 18px rgba(201,168,90,.32)}}
.day-cell{min-width:0;text-align:center}.day-num{font:700 21px/1 Georgia,serif}.day-name{font-size:10px;font-weight:800;color:var(--muted);margin-top:4px;white-space:nowrap;letter-spacing:.35px}
.mode{width:100%;min-width:0;height:42px;border:1px solid var(--line);border-radius:11px;padding:0 7px;background:rgba(255,255,255,.58);color:var(--ink);font-size:12px;font-weight:700;text-align:center;appearance:none;-webkit-appearance:none}
.mode:focus{outline:2px solid rgba(201,168,90,.35);outline-offset:1px}
.time{width:100%;min-width:0;height:42px;border:1px solid var(--line);border-radius:11px;padding:0 2px;background:rgba(255,255,255,.72);color:var(--ink);font-size:16px;font-weight:650;text-align:center;appearance:none;-webkit-appearance:none}
.time::-webkit-calendar-picker-indicator{opacity:0;width:0;height:0;margin:0;padding:0;display:none}.time::-webkit-datetime-edit{padding:0}.time::-webkit-datetime-edit-fields-wrapper{padding:0}.time::-webkit-datetime-edit-text{padding:0 1px}.time:focus{outline:2px solid rgba(201,168,90,.35);outline-offset:1px}
.total{min-width:0;height:42px;border-radius:11px;background:#d9d0c5;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}.total.zero{font-weight:500;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 14px}.card{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:12px 9px;box-shadow:0 4px 14px rgba(42,35,28,.08)}
.label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.2px;white-space:nowrap}.value{font:700 23px/1.1 Georgia,serif;margin-top:6px;white-space:nowrap}.value.good{color:var(--good)}.value.bad{color:var(--bad)}
.settings-modal{position:fixed;inset:0;background:rgba(20,18,16,.62);backdrop-filter:blur(4px);display:grid;place-items:end center;padding:14px;z-index:100}.settings-modal.hidden{display:none!important}
.settings-sheet{width:min(760px,100%);max-height:min(82vh,700px);overflow:auto;background:var(--panel);border:1px solid var(--gold);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.settings-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--panel2);font:700 21px Georgia,serif}.close-settings{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font-size:22px}.settings-body{padding:15px;display:grid;gap:12px}.setting-row{display:flex;align-items:end;gap:9px;flex-wrap:wrap}.setting-row label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:700}.setting-row input{height:40px;border:1px solid var(--line);border-radius:10px;background:white;padding:0 10px}.action{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--dark);color:var(--cream);padding:0 12px;font-weight:700}
.note{margin:0 14px;color:var(--muted);font-size:10px;line-height:1.4}.settings-note{margin:0;color:var(--muted);font-size:10px;line-height:1.45}.hidden{display:none!important}
@media(max-width:560px){
 body{background:linear-gradient(180deg,#302f2c 0 25%,var(--bg) 25% 100%)}
 .header{padding:12px 10px 19px;min-height:236px}.logo{width:104px;height:104px}.brand-sub{left:11px;bottom:65px;font-size:8px;letter-spacing:3px}.header-art{right:9px;bottom:48px;width:91px;height:64px}.title{font-size:clamp(38px,10.5vw,50px)}
 .toolbar,.table-shell,.summary{margin-left:9px;margin-right:9px}.table-head,.row{grid-template-columns:1.05fr .98fr 1.08fr 1.08fr .98fr;gap:4px}.table-head{padding-left:7px;padding-right:7px;font-size:10px;letter-spacing:0}.row{padding-left:7px;padding-right:7px;min-height:64px}.row.current-day{min-height:60px;margin:2px 3px}.day-num{font-size:18px}.day-name{font-size:9px}.mode{font-size:10px;padding:0 3px}.time{font-size:15px;padding:0 1px}.total{font-size:14px}.summary{gap:6px}.card{padding:11px 7px}.label{font-size:9px}.value{font-size:20px}
}
@media(max-width:390px){.table-head,.row{grid-template-columns:.98fr .98fr 1.08fr 1.08fr .98fr}.table-head{font-size:9px}.mode{font-size:9.5px}.time{font-size:14px}.day-num{font-size:17px}.value{font-size:18px}}
</style>
</head>

 <h1 class="title">Registro Ore</h1>
 <div class="title-rule"><span></span><b>•</b><span></span></div>
</header>

<section class="toolbar" aria-label="Selezione mese">
 <button class="month-btn" id="prev" type="button" aria-label="Mese precedente">‹</button>
 <div class="month-label"><span aria-hidden="true">▣</span><span id="monthLabel">Agosto 2026</span></div>
 <button class="month-btn" id="next" type="button" aria-label="Mese successivo">›</button>
</section>

<section class="table-shell">
 <div class="table-head"><div>Giorno</div><div>Mode</div><div>Entrata</div><div>Uscita</div><div>Totale</div></div>
 <div id="rows" class="rows"></div>
</section>

<section class="summary" aria-label="Riepilogo">
 <div class="card"><div class="label">Totale ore</div><div id="total" class="value">0:00</div></div>
 <div class="card"><div class="label">Ore extra</div><div id="balance" class="value">0:00</div></div>
 <div class="card"><div class="label">Ferie rimanenti</div><div id="ferieResidue" class="value">—</div></div>
</section>

<div class="settings-modal hidden" id="settingsPanel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
 <section class="settings-sheet">
  <div class="settings-head"><span id="settingsTitle">Impostazioni</span><button class="close-settings" id="settingsClose" type="button" aria-label="Chiudi">×</button></div>
  <div class="settings-body">
   <div class="setting-row">
    <label>Ferie spettanti nell'anno<input id="ferieTotali" type="number" min="0" step="1" inputmode="numeric" placeholder="es. 26"></label>
   </div>
   <div class="setting-row">
    <button class="action" id="saveData" type="button">Salva backup</button>
    <button class="action" id="loadData" type="button">Ripristina</button>
    <input id="dataFile" type="file" accept=".json,application/json" class="hidden">
   </div>
   <div id="saveMsg" class="settings-note"></div>
  </div>
 </section>
</div>


</div>
<script>
(()=>{'use strict';
const months=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const dayNames=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const now=new Date(); const M={month:now.getMonth(),year:now.getFullYear()};
const rows=document.getElementById('rows');
const prefix='ore_lavoro_v3_';
const ferieKey=y=>prefix+'ferie_totali_'+y;
const ferieTotali=document.getElementById('ferieTotali');
const ferieResidue=document.getElementById('ferieResidue');
const settingsPanel=document.getElementById('settingsPanel');
const saveMsg=document.getElementById('saveMsg');
const parse=v=>{if(!v)return null;let p=v.split(':');if(p.length!==2)return null;let h=Number(p[0]),m=Number(p[1]);return Number.isInteger(h)&&Number.isInteger(m)&&h>=0&&h<=23&&m>=0&&m<=59?h*60+m:null};
const fmt=n=>{let s=n<0?'-':'',x=Math.round(Math.abs(n));return s+Math.floor(x/60)+':'+String(x%60).padStart(2,'0')};
const eur=n=>(n<0?'-':'')+'€ '+Math.abs(n).toFixed(2).replace('.',',');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const read=d=>{try{return JSON.parse(localStorage.getItem(prefix+iso(d))||'{}')}catch(e){return{}}};
const write=(d,o)=>localStorage.setItem(prefix+iso(d),JSON.stringify(o));
const monday=d=>{let x=new Date(d),shift=(x.getDay()+6)%7;x.setDate(x.getDate()-shift);return x};
function info(d){
 const z=read(d),status=z.status||'',a=parse(z.in||''),b=parse(z.out||'');
 if(status==='Ferie')return {status:'Ferie',count:true,work:300,in:z.in||'',out:z.out||''};
 if(status==='Libero')return {status:'Libero',count:false,work:0,in:z.in||'',out:z.out||''};
 if(a===null||b===null)return {status:'',count:true,work:0,in:z.in||'',out:z.out||''};
 let w=b-a;if(w<0)w+=1440;
 return {status:'',count:true,work:w,in:z.in||'',out:z.out||''};
}
function weekDates(start){let a=[];for(let i=0;i<7;i++){let d=new Date(start);d.setDate(d.getDate()+i);a.push(d)}return a}
function countFerieYear(y){let n=0;for(let m=0;m<12;m++){const last=new Date(y,m+1,0).getDate();for(let day=1;day<=last;day++){if((read(new Date(y,m,day)).status||'')==='Ferie')n++;}}return n}
function render(){
 const y=M.year,m=M.month;
 document.getElementById('monthLabel').textContent=months[m]+' '+y;
 rows.innerHTML='';
 const first=new Date(y,m,1),last=new Date(y,m+1,0),start=monday(first);
 let visible=[],weekCount=0;
 for(let ws=new Date(start);ws<=last;ws.setDate(ws.getDate()+7)){
   weekCount++;
   const dates=weekDates(ws), infos=dates.map(info);
   const count=infos.filter(x=>x.count).length;
   const target=count?1800/count:0;
   dates.forEach((d,i)=>{
     if(d.getMonth()!==m)return;
     const a=infos[i];
     const row=document.createElement('div');row.className='row';
     const today=new Date(); if(d.getFullYear()===today.getFullYear()&&d.getMonth()===today.getMonth()&&d.getDate()===today.getDate())row.classList.add('current-day');
     if(a.status==='Libero')row.classList.add('off');
     if(a.status==='Ferie')row.classList.add('ferie');
     const day=document.createElement('div');day.className='day-cell';
     day.innerHTML='<div class="day-num">'+String(d.getDate()).padStart(2,'0')+'</div><div class="day-name">'+dayNames[d.getDay()]+'</div>';
     const mode=document.createElement('select');mode.className='mode';mode.setAttribute('aria-label','Mode '+d.getDate());
     [['','Lavoro'],['Ferie','Ferie'],['Libero','Libero']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;mode.appendChild(o)});
     mode.value=a.status==='Ferie'||a.status==='Libero'?a.status:'';
     const tin=document.createElement('input');tin.className='time';tin.type='time';tin.value=a.in;tin.setAttribute('aria-label','Entrata '+d.getDate());
     const tout=document.createElement('input');tout.className='time';tout.type='time';tout.value=a.out;tout.setAttribute('aria-label','Uscita '+d.getDate());
     const calc=document.createElement('div');calc.className='total '+(a.work===0?'zero':'');calc.textContent=a.work?fmt(a.work):'0:00';
     row.append(day,mode,tin,tout,calc);rows.appendChild(row);
     function save(statusOverride){
       const status=statusOverride!==undefined?statusOverride:mode.value;
       if(status==='Ferie'||status==='Libero'){tin.value='';tout.value='';}
       write(d,{status,in:tin.value,out:tout.value});render();
     }
     mode.addEventListener('change',()=>save(mode.value));
     tin.addEventListener('change',()=>{mode.value='';write(d,{status:'',in:tin.value,out:tout.value});render()});
     tout.addEventListener('change',()=>{mode.value='';write(d,{status:'',in:tin.value,out:tout.value});render()});
     const hasActual=a.status==='Ferie'||(a.in!==''&&a.out!=='');
     const ex=(a.status==='Ferie')?0:(hasActual?a.work-target:0);
     const cash=ex/60*10;
     visible.push({d,a,ex,cash});
   });
 }
 const v=visible,total=v.reduce((s,x)=>s+x.a.work,0),bal=v.reduce((s,x)=>s+x.ex,0),cash=v.reduce((s,x)=>s+x.cash,0);
 document.getElementById('total').textContent=fmt(total);
 const be=document.getElementById('balance');be.textContent=fmt(bal);be.className='value '+(bal>0?'good':bal<0?'bad':'');
 const quota=Number(localStorage.getItem(ferieKey(y))||0),used=countFerieYear(y),residue=quota-used;
 ferieResidue.textContent=quota>0?String(residue):'—';ferieResidue.className='value '+(residue<0?'bad':'');
}

document.getElementById('prev').addEventListener('click',()=>{M.month--;if(M.month<0){M.month=11;M.year--}loadFerieQuota();render();});
document.getElementById('next').addEventListener('click',()=>{M.month++;if(M.month>11){M.month=0;M.year++}loadFerieQuota();render();});
document.getElementById('settingsToggle').addEventListener('click',()=>settingsPanel.classList.remove('hidden'));
document.getElementById('settingsClose').addEventListener('click',()=>settingsPanel.classList.add('hidden'));
settingsPanel.addEventListener('click',e=>{if(e.target===settingsPanel)settingsPanel.classList.add('hidden')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')settingsPanel.classList.add('hidden')});
function loadFerieQuota(){const v=localStorage.getItem(ferieKey(M.year));ferieTotali.value=v===null?'':v;}
ferieTotali.addEventListener('change',()=>{localStorage.setItem(ferieKey(M.year),String(Math.max(0,Number(ferieTotali.value)||0)));render();});
const saveData=document.getElementById('saveData'),loadData=document.getElementById('loadData'),dataFile=document.getElementById('dataFile');
saveData.addEventListener('click',()=>{const backup={version:1,createdAt:new Date().toISOString(),data:{}};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(prefix))backup.data[k]=localStorage.getItem(k)}const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='registro_ore_backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);saveMsg.textContent='Backup creato.';});
loadData.addEventListener('click',()=>dataFile.click());
dataFile.addEventListener('change',()=>{const file=dataFile.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const backup=JSON.parse(reader.result);if(!backup||backup.version!==1||!backup.data||typeof backup.data!=='object')throw new Error('invalid');let n=0;for(const [k,v] of Object.entries(backup.data)){if(k.startsWith(prefix)){localStorage.setItem(k,v);n++}}loadFerieQuota();render();saveMsg.textContent='Dati ripristinati: '+n+' record.';}catch(e){saveMsg.textContent='File di backup non valido.'}dataFile.value=''};reader.readAsText(file)});
loadFerieQuota();render();
})();
</script>
</body>
</html>
